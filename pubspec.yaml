name: gardoon
description: "گردون — اپ مدیریت بازی مافیا برای گرداننده؛ کاملاً فارسی و کاملاً آفلاین."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # نسخه‌ای بدون وابستگی C++ (jni) — برای بیلد بدون NDK
  path_provider_android: 2.2.15

  # وضعیت اپ (طبق architecture.md — بخش ۲)
  flutter_riverpod: ^2.6.1
  # مسیریابی
  go_router: ^14.6.2
  # تنظیمات (تم، صدا، وضعیت طلایی)
  shared_preferences: ^2.3.4
  # فرمت .grdn — ZIP خالص Dart
  archive: ^4.0.0
  # checksum فایل سناریو
  crypto: ^3.0.6
  # ذخیره سناریوها در پوشه اپ
  path_provider: ^2.1.5
  # اشتراک‌گذاری فایل .grdn
  share_plus: ^10.1.2
  # ورود فایل .grdn از خارج (تلگرام/فایل‌منیجر)
  file_picker: ^8.1.6
  # افکت‌های صوتی میزگرد
  audioplayers: ^6.1.0

dependency_overrides:
  # سازگاری compileSdk پلاگین‌ها (بیلد بدون NDK/SDK جدید)
  flutter_plugin_android_lifecycle: 2.0.22

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/scenarios/
    - assets/sounds/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
